<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA GÉNESIS - Ecosistema de Recursos Humanos</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-hover: #0ea5e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        select, input[type="file"], button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        .output-box {
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            max-height: 350px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: #38bdf8;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MIA GÉNESIS - RH & Fiscal</h1>
        <div class="subtitle">Ecosistema Integral de Inteligencia Artificial para Recursos Humanos</div>

        <!-- Sección de Carga de Archivos -->
        <div class="section">
            <label for="archivoInput">Cargar Archivo de Datos / Nómina / Documento:</label>
            <input type="file" id="archivoInput">
            <button onclick="subirArchivo()">Subir Archivo al Servidor</button>
            <div id="statusSubida" class="status-msg"></div>
        </div>

        <!-- Sección de Ejecución de Motores -->
        <div class="section">
            <label for="motorSelect">Seleccionar Motor Operativo:</label>
            <select id="motorSelect">
                <option value="actualizacion_fiscal">Actualización Fiscal</option>
                <option value="actualizacion_imss">Actualización IMSS</option>
                <option value="asistencia">Asistencia</option>
                <option value="documental">Documental</option>
                <option value="documental_completo">Documental Completo</option>
                <option value="finiquitos">Finiquitos</option>
                <option value="fiscal">Fiscal</option>
                <option value="fonacot">Fonacot</option>
                <option value="imss_infonavit">IMSS e Infonavit</option>
                <option value="incapacidades">Incapacidades</option>
                <option value="infonavit">Infonavit</option>
                <option value="nomina_ordinaria">Nómina Ordinaria</option>
                <option value="pension_alimenticia">Pensión Alimenticia</option>
                <option value="vacaciones">Vacaciones</option>
                <option value="vales">Vales</option>
                <option value="nucleo_central">Núcleo Central</option>
            </select>
            <button onclick="ejecutarMotor()">Ejecutar Motor Seleccionado</button>
        </div>

        <!-- Sección de Resultados -->
        <div class="section">
            <label>Consola de Resultados:</label>
            <div id="resultadoConsola" class="output-box">Esperando ejecución de motores...</div>
        </div>
    </div>

    <script>
        async function subirArchivo() {
            const input = document.getElementById('archivoInput');
            const statusDiv = document.getElementById('statusSubida');

            if (input.files.length === 0) {
                statusDiv.innerText = "Por favor selecciona un archivo primero.";
                statusDiv.style.color = "#f87171";
                return;
            }

            const formData = new FormData();
            formData.append('archivo', input.files[0]);

            statusDiv.innerText = "Subiendo archivo...";
            statusDiv.style.color = "#38bdf8";

            try {
                const response = await fetch('/subir_archivo', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                statusDiv.innerText = data.resultado || "Archivo procesado.";
                statusDiv.style.color = "#4ade80";
            } catch (error) {
                statusDiv.innerText = "Error de conexión al subir el archivo.";
                statusDiv.style.color = "#f87171";
            }
        }

        async function ejecutarMotor() {
            const motorSelect = document.getElementById('motorSelect').value;
            const consola = document.getElementById('resultadoConsola');

            consola.innerText = `Ejecutando [${motorSelect}], por favor espere...`;

            try {
                const response = await fetch('/ejecutar_motor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ motor: motorSelect })
                });
                const data = await response.json();
                consola.innerText = data.resultado || "Sin respuesta del motor.";
            } catch (error) {
                consola.innerText = "Error crítico al intentar comunicarse con el servidor para ejecutar el motor.";
            }
        }
    </script>
</body>
</html>
